apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-v2
  template:
    metadata:
      labels:
        app: recommendation-v2
    spec:
      containers:
        - name: recommendation-v2
          image: YOUR_DOCKERHUB_USERNAME/recommendation-system:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-v2-service
spec:
  type: NodePort
  selector:
    app: recommendation-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30002
