apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-v3
  template:
    metadata:
      labels:
        app: recommendation-v3
    spec:
      containers:
        - name: recommendation-v3
          image: YOUR_DOCKERHUB_USERNAME/recommendation-system:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-v3-service
spec:
  type: NodePort
  selector:
    app: recommendation-v3
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30003
